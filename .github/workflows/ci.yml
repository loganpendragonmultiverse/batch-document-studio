name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Assert release files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -f "release/batch-document-studio-v${VERSION}.zip"
          test -f "release/batch-document-studio-v${VERSION}.zip.sha256"

  browser-preflight:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix /tmp/browser --no-audit --ignore-scripts playwright@1.64.1
      - run: node scripts/test-preflight-browser.mjs
        env:
          PLAYWRIGHT_MODULE: /tmp/browser/node_modules/playwright/index.mjs
