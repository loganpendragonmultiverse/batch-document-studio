name: Release build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - run: npm run package
      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false
          files: |
            release/*.zip
            release/*.sha256
