name: Bug report
description: Report a reproducible defect without private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior using sanitized examples.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: dropdown
    id: template
    attributes:
      label: Template type
      options: [PDF, PNG, JPEG]
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data type
      options: [CSV, XLSX]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed real recipient data, private templates, and credentials.
          required: true
